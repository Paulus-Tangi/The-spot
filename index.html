<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Spot - Learner Marketplace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>The Spot</h1>
      <p>Buy and sell second-hand items in the school community.</p>
    </div>
  </header>

  <main class="container">
    <section class="card form-card">
      <h2>List an Item for Sale</h2>
      <form id="itemForm">
        <label for="title">Item name</label>
        <input type="text" id="title" name="title" placeholder="e.g. Textbook, laptop, backpack" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Add condition, size, brand or any details" required></textarea>

        <label for="price">Price (USD)</label>
        <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g. 15.00" required>

        <label for="condition">Condition</label>
        <select id="condition" name="condition" required>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Needs repair">Needs repair</option>
        </select>

        <label for="contact">Contact info</label>
        <input type="text" id="contact" name="contact" placeholder="e.g. email, phone or classroom" required>

        <button type="submit">Post Item</button>
      </form>
    </section>

    <section class="card listings-card">
      <h2>Available Items</h2>
      <div id="itemList" class="item-list">
        <p class="empty-state">No items listed yet. Add the first one!</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Made for learners to sell and buy second-hand items.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
