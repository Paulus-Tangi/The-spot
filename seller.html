<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Spot - Seller Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>The Spot</h1>
      <p>Seller page: list second-hand items for learners to buy.</p>
    </div>
  </header>

  <main class="container">
    <section class="page-links card">
      <a class="nav-link" href="welcome.html">Welcome</a>
      <a class="nav-link" href="buyer.html">Go to Buyer Page</a>
      <span id="userStatus" class="user-panel mini hidden"></span>
      <button id="logoutButton" class="nav-link nav-logout hidden">Log out</button>
    </section>

    <section id="loginRequired" class="card hidden">
      <h2>Account required</h2>
      <p>To sell items, first create an account using your student number on the Welcome page.</p>
      <a class="nav-link" href="welcome.html">Go to Welcome</a>
    </section>

    <section id="pageContent">
      <section class="card form-card">
        <h2>List an Item for Sale</h2>
        <form id="itemForm">
        <label for="title">Item name</label>
        <input type="text" id="title" name="title" placeholder="e.g. Textbook, laptop, backpack" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Add condition, size, brand or any details" required></textarea>

        <label for="price">Price (USD)</label>
        <input type="number" id="price" name="price" min="0" step="0.01" placeholder="e.g. 15.00" required>

        <label for="condition">Condition</label>
        <select id="condition" name="condition" required>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Needs repair">Needs repair</option>
        </select>

        <label for="contact">Contact info</label>
        <input type="text" id="contact" name="contact" placeholder="Student account will fill this" required>

        <button type="submit">Post Item</button>
      </form>
    </section>
  </section>
  </main>

  <footer>
    <div class="container">
      <p>Made for learners to sell and buy second-hand items.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
